services:
  db:
    # Verified PostgreSQL 18.6 / PostGIS 3.6.4; keep hosted TEST on this digest too.
    image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
    platform: linux/amd64
    container_name: cemetery-mapping-db-${APP_ENV:-dev}
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=auto"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cemetery_mapping_dev}
      POSTGRES_USER: ${POSTGRES_USER:-cemetery_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an ignored local env file or deployment secret manager}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 stores its cluster in 18/docker below this volume root.
      - cemetery-postgres-data-${APP_ENV:-dev}:/var/lib/postgresql
      - ./db/seed:/seed:ro
      - ./db/validation:/validation:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cemetery_app} -d ${POSTGRES_DB:-cemetery_mapping_dev}"]
      interval: 5s
      timeout: 5s
      retries: 12

  liquibase:
    image: liquibase/liquibase:4.33.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/changelog:/liquibase/changelog
    working_dir: /liquibase

volumes:
  cemetery-postgres-data-dev:
  cemetery-postgres-data-test:
  cemetery-postgres-data-stage:
  cemetery-postgres-data-prod:
