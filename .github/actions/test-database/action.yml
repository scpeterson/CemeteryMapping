name: Prepare isolated TEST database
description: Start the runner's PostGIS instance, migrate, seed, and configure API access
inputs:
  validate:
    description: Validate changelog and replay migrations with rollback before seeding
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        for attempt in 1 2 3; do
          npm run db:up && break
          if [ "$attempt" = "3" ]; then exit 1; fi
          sleep 10
        done
    - if: inputs.validate == 'true'
      shell: bash
      run: npm run db:validate
    - if: inputs.validate == 'true'
      shell: bash
      run: npm run db:rollback:test
    - shell: bash
      run: npm run db:migrate
    - shell: bash
      run: npm run db:seed:demo
    - shell: bash
      run: npm run db:configure-api
