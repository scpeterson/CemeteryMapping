version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Stay on TypeScript 6 until typescript-eslint supports TypeScript 7.
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0 <8.0.0"

  - package-ecosystem: "bundler"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Built locally from manually reviewed, digest-pinned bases (ADR 0212).
      - dependency-name: "cemeterymapping-postgis"
      # Stay on Liquibase 4.33.0 pending owner review/approval of the 5.x license change.
      # See ADR 0003. A future 5.x upgrade must also supply the PostgreSQL JDBC driver.
      - dependency-name: "liquibase/liquibase"
        versions:
          - ">=5.0.0"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
