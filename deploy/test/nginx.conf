# Only the local Cloudflare Tunnel reaches this listener. Cloudflare replaces
# CF-Connecting-IP; never expose this listener directly to untrusted clients.
limit_req_zone $http_cf_connecting_ip zone=access_requests:1m rate=5r/m;

server {
    listen 127.0.0.1:8080;
    server_name test.nhcemeteries.org;
    root /usr/share/nginx/html;
    client_max_body_size 30m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HTML and authenticated responses must not survive an identity/deployment change.
    add_header Cache-Control "no-store" always;
    location = /api/access-requests {
        client_max_body_size 16k;
        limit_req zone=access_requests burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
