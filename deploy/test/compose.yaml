# Dedicated Linux host only. The API deliberately keeps its loopback binding.
name: nhcemeteries-test
services:
  db:
    # PostgreSQL 18.6 / PostGIS 3.6.4, identical to root Compose environments.
    image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=auto"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: cemetery_mapping_test
      POSTGRES_USER: cemetery_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the hosted database password}
      CEMETERY_API_PASSWORD: ${CEMETERY_API_PASSWORD:?Set a separate API database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Logical restore into a separate volume; retain the original 17 cluster.
      - database_pg18:/var/lib/postgresql
      - ./configure-api-role.sh:/usr/local/bin/configure-api-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cemetery_app -d cemetery_mapping_test"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build:
      context: ../..
      dockerfile: deploy/test/Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file: runtime.env
    environment:
      APP_ENV: test
      AUTH_MODE: auth0
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: cemetery_mapping_test
      PGUSER: cemetery_api
      PGPASSWORD: ${CEMETERY_API_PASSWORD:?Set a separate API database password}
      API_PORT: 3001
      ACCESS_REQUEST_TRUST_PROXY: loopback
      MEDIA_UPLOAD_DIR: /media
    volumes:
      - /srv/nhcemeteries/media:/media
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db:
        condition: service_healthy
  web:
    image: nginx:stable-alpine@sha256:985220252f3863977e468f611ef118ebd01421289dd86ee1ae99cb068c3bce2b
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
  tunnel:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 40s
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run --token-file /run/secrets/tunnel-token
    volumes:
      - ./tunnel-token:/run/secrets/tunnel-token:ro
    profiles: [tunnel]
    depends_on: [web]
volumes:
  # Retained for recovery of the pre-upgrade cluster; never mount it on 18.
  database:
  database_pg18:
    name: nhcemeteries-test-postgresql18
